# ========================================================
# Nginx High Availability & Concurrency Configuration
# SIS-APAFA V11 - Balanceo de Carga y Tolerancia a Fallos
# ========================================================

upstream php_backend {
    least_conn;
    server app:9000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Zonas de Rate Limiting para protección Anti-DDoS y Fuerza Bruta
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pos_limit:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    # Headers de Seguridad de Nivel Bancario / Alta Disponibilidad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    index index.php index.html;
    charset utf-8;

    # Compresión Gzip de Alto Rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Límites de Conexión y Subida de Archivos
    client_max_body_size 64M;
    limit_conn conn_limit 100;

    # Healthcheck para Load Balancers / Kubernetes / AWS ALB (Bypass de Rate Limiting y Logs)
    location /healthz {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Caché Agresivo de Activos Estáticos para Liberar Recursos de CPU
    location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Protección estricta en el Endpoint de Login contra Fuerza Bruta
    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Optimización del Punto de Venta (POS) y Búsqueda por Escáner
    location /pagos {
        limit_req zone=pos_limit burst=15 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        limit_req zone=general_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt  { 
        access_log off; 
        log_not_found off; 
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_keep_conn on;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Buffering optimizado para alta concurrencia
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_connect_timeout 10s;
    }

    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
